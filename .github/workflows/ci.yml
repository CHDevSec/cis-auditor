name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Lint (go vet, bash -n, py_compile)
        run: make lint
      - name: Unit tests
        run: make test
      - name: Generated docs are up to date
        run: make docs && git diff --exit-code -- docs scripts

  audit:
    name: Real audit on Ubuntu 22.04
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Audit every profile (read-only)
        run: sudo env "PATH=$PATH" make audit_all
      - name: No control may end in ERROR
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = [(f, c["ID"]) for f in glob.glob("results/audit-results-*.json")
                 for c in json.load(open(f))["controls"] if c["Status"] == "ERROR"]
          print(f"{len(glob.glob('results/audit-results-*.json'))} reports, {len(bad)} errors")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cis-audit-reports
          path: results/
